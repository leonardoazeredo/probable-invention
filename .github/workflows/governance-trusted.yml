# Sole producer of the required check "governance/trusted".
#
# pull_request_target runs this file and the governance scripts from the BASE
# branch, so a PR cannot change the workflow or scripts that judge it. PR code is
# checked out as data and never executed: no install scripts, no PR config, no
# PR tests. Token is read-only and no secrets are exposed.
name: governance-trusted

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: governance-trusted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trusted:
    name: governance/trusted
    runs-on: ubuntu-latest
    steps:
      - name: Check out base branch (trusted tooling)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out PR head (data only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          path: head
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: trusted/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install base-branch dependencies
        working-directory: trusted
        run: pnpm install --frozen-lockfile

      - name: Fetch base into PR clone
        working-directory: head
        run: git fetch --no-tags origin ${{ github.event.pull_request.base.sha }}

      - name: Judge PR with base-branch rules
        run: >
          node trusted/governance/trusted-check.mjs
          --trusted trusted
          --head head
          --base ${{ github.event.pull_request.base.sha }}

  # Figma fidelity: renders the PR's screens with base-branch tooling and diffs
  # them against the base branch's committed Figma references. PR code runs only
  # inside a network-isolated headless browser, never on the runner itself.
  visual:
    name: governance/visual
    runs-on: ubuntu-24.04
    # Pinned render environment: the official Playwright image for the exact
    # Playwright version in package.json (a governance test checks they match),
    # so Chromium, system libraries and fonts don't drift with the runner image.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - name: Install git (checkout needs it for history; the image may not ship it)
        run: |
          command -v git >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends git)
          git config --global --add safe.directory '*'

      - name: Check out base branch (trusted tooling and references)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out PR head (data only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          path: head
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: trusted/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install base-branch dependencies (Chromium comes with the container)
        working-directory: trusted
        run: pnpm install --frozen-lockfile

      - name: Fetch base into PR clone
        working-directory: head
        run: git fetch --no-tags origin ${{ github.event.pull_request.base.sha }}

      - name: Diff PR screens against Figma references
        run: >
          node trusted/governance/visual/visual-check.mjs
          --trusted trusted
          --head head
          --base ${{ github.event.pull_request.base.sha }}
          --out visual-result

      - name: Upload rendered, reference and diff images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: visual-result/
          if-no-files-found: ignore
